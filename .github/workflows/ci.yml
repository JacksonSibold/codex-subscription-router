name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python-compat:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Python regression tests on minimum supported version
        run: python -m unittest discover -s tests -v
      - name: Source and credential validation on minimum supported version
        run: python scripts/validate.py

  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Python regression tests
        run: python -m unittest discover -s tests -v
      - name: Source and credential validation
        run: python scripts/validate.py
      - name: Install interface dependencies
        working-directory: app
        run: npm ci
      - name: Install Linux desktop window libraries
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install desktop build dependencies
        run: python -m pip install -r desktop/requirements.txt
      - name: Production interface build
        working-directory: app
        run: npm run build
      - name: Install Chrome for rendered UI checks
        id: setup-chrome
        uses: browser-actions/setup-chrome@v1
      - name: Isolated API and rendered UI checks
        working-directory: app
        env:
          CHROME_PATH: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: npm run test:ui
      - name: Package and launch-test the ${{ matrix.platform }} archive
        shell: bash
        run: |
          VERSION="$(tr -d '\r\n' < VERSION)"
          python scripts/package_release.py --platform "${{ matrix.platform }}" --version "$VERSION"
          python scripts/package_desktop.py --version "$VERSION"
          if [ "${{ matrix.platform }}" = "windows" ]; then
            python scripts/verify_release.py "release/relay-${VERSION}-windows.zip"
          else
            python scripts/verify_release.py "release/relay-${VERSION}-${{ matrix.platform }}.tar.gz"
          fi
