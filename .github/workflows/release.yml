name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Python regression tests
        run: python -m unittest discover -s tests -v
      - name: Install interface dependencies
        working-directory: app
        run: npm ci
      - name: Production interface build
        working-directory: app
        run: npm run build
      - name: Package release
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python scripts/package_release.py --platform "${{ matrix.platform }}" --version "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: relay-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create checksums
        working-directory: release
        run: sha256sum *.zip *.tar.gz > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          REPO="$GITHUB_REPOSITORY"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --repo "$REPO" --clobber
          else
            gh release create "$TAG" release/* --repo "$REPO" --title "Relay $TAG" --generate-notes --verify-tag
          fi
