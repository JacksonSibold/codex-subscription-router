name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Python regression tests
        run: python -m unittest discover -s tests -v
      - name: Source and credential validation
        run: python scripts/validate.py
      - name: Install interface dependencies
        working-directory: app
        run: npm ci
      - name: Install Linux desktop window libraries
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libegl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install desktop build dependencies
        run: python -m pip install -r desktop/requirements.txt
      - name: Production interface build
        working-directory: app
        run: npm run build
      - name: Package release
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          python scripts/package_release.py --platform "${{ matrix.platform }}" --version "$VERSION"
          python scripts/package_desktop.py --version "$VERSION"
      - name: Verify archive from an isolated extraction
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [ "${{ matrix.platform }}" = "windows" ]; then
            python scripts/verify_release.py "release/relay-${VERSION}-windows.zip"
          else
            python scripts/verify_release.py "release/relay-${VERSION}-${{ matrix.platform }}.tar.gz"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: relay-${{ matrix.platform }}
          path: release/*
          if-no-files-found: error

  publish:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Create checksums
        working-directory: release
        run: sha256sum *.zip *.tar.gz > SHA256SUMS.txt
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="$GITHUB_REF_NAME"
          REPO="$GITHUB_REPOSITORY"
          NOTES="docs/releases/${TAG#v}.md"
          if gh release view "$TAG" --repo "$REPO" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --repo "$REPO" --clobber
          elif [ -f "$NOTES" ]; then
            gh release create "$TAG" release/* --repo "$REPO" --title "Relay $TAG" --notes-file "$NOTES" --verify-tag
          else
            gh release create "$TAG" release/* --repo "$REPO" --title "Relay $TAG" --generate-notes --verify-tag
          fi

  verify-assets:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Download every published asset
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir downloaded
      - name: Verify downloadable checksums
        working-directory: downloaded
        run: sha256sum -c SHA256SUMS.txt
